name: 'Setup Node with cached dependencies for API code generation'
description: 'Install Node.js, restore npm and node_modules caches, and run npm ci on cache miss'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.19.0

    - name: Restore npm cache
      id: cache-npm
      uses: actions/cache/restore@v6
      with:
        path: ~/.npm
        key: npm-cache-${{ hashFiles('api/package-lock.json') }}

    - name: Restore node_modules cache
      id: cache-node-modules
      uses: actions/cache/restore@v6
      with:
        path: api/node_modules
        key: node-modules-${{ hashFiles('api/package-lock.json') }}

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: |
        pushd api
        npm ci
        popd
      shell: bash

    - name: Save node_modules cache
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: api/node_modules
        key: node-modules-${{ hashFiles('api/package-lock.json') }}
