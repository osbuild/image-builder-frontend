name: Unit Tests

on:
  pull_request:
    branches: [ "main", "rhel-10.2", "rhel-10.3" ]
  push:
    branches: [ "main", "rhel-10.2", "rhel-10.3" ]
  merge_group:

# this prevents multiple jobs from the same pr
# running when new changes are pushed.
concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Node.js with cached dependencies
      uses: ./.github/actions/setup-node-cached
    - name: Run unit tests
      run: npm run test:coverage
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/vitest/lcov.info
        flags: vitest
        verbose: true

  cockpit-integration-tests:
    name: Cockpit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Node.js with cached dependencies
      uses: ./.github/actions/setup-node-cached
    - name: Run integration tests with cockpit
      run: npm run test:cockpit
