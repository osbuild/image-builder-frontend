# This action creates a release every second Wednesday
name: "Create and push release tag"

on:
  workflow_dispatch:
    inputs:
      version:
        description: |
          Version to tag. Use when creating dot-releases (e.g. v94 -> v94.1, v94.1 -> v94.2).
          Leave empty for major (v94 -> v95).
        required: false
        default: ""
      branch:
        description: 'Branch to create the release on.'
        required: false
        default: ""
  schedule:
    - cron: "0 8 * * 3"

jobs:
  tag-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Even or odd week
        run: if [ `expr \`date +\%s\` / 86400 \% 2` -eq 0 ]; then echo "WEEK=odd" >> $GITHUB_ENV; else echo "WEEK=even" >> $GITHUB_ENV; fi
        shell: bash

      - name: Upstream tag
        uses: osbuild/release-action@create-tag
        if: ${{ env.WEEK == 'odd' || github.event_name != 'schedule' }}
        with:
          token: "${{ secrets.SCHUTZBOT_GITHUB_ACCESS_TOKEN }}"
          username: "imagebuilder-bot"
          email: "imagebuilder-bots+imagebuilder-bot@redhat.com"
          version: ${{ github.event.inputs.version }}
          base_branch: ${{ inputs.branch || 'main' }}
